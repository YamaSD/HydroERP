  <meta charset="UTF-8">

  <title>Contact Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      color: #1f2937;
    }

    .form-container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .form-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .form-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #111827;
    }

    .form-header p {
      font-size: 14px;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: 0.2s ease;
      background: #fff;
    }

    .form-group input {
      height: 48px;
    }

    .form-group textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .send-btn {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .send-btn:hover {
      background: #1d4ed8;
    }

    .send-btn:active {
      transform: scale(0.98);
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      .form-container {
        padding: 25px 20px;
        border-radius: 12px;
      }

      .form-header h1 {
        font-size: 24px;
      }
    }
     html { scroll-behavior: smooth; }
  body, h1{ font-family: 'Albert Sans', ui-sans-serif, system-ui, sans-serif; color: #444444; }
  p,h2, h3, h4, .font-display { font-family: 'Barlow', ui-sans-serif, system-ui, sans-serif; }

  .grayscale-hover { filter: grayscale(100%); opacity: 0.75; transition: all .2s ease; }
  .grayscale-hover:hover { filter: grayscale(0%); opacity: 1; }

  .tour-swiper .swiper-slide { display: flex; align-items: center; justify-content: center; }
  .tour-pagination .swiper-bullet {
    width: 22px; height: 22px; padding: 6px; box-sizing: border-box;
    background-color: #C8C8F4; background-clip: content-box;
    border-radius: 999px; border: none; cursor: pointer; transition: background-color .2s ease;
    display: flex;
  }
  .tour-pagination .swiper-bullet.active { background-color: #4C4DDC; }

    margin: 0;

<div class="mt-12 flex justify-center items-center">
      <div class="form-container">

    <div class="form-header">

    <form>
      
      <div class="form-group">

          placeholder="Enter your name"

          type="email"

<script>
  document.getElementById('menuBtn').addEventListener('click', function () {
    document.getElementById('mobileMenu').classList.toggle('hidden');
  });

  document.querySelectorAll('#pricing details').forEach(function (el) {
    el.addEventListener('toggle', function () {
      if (el.open) {
        document.querySelectorAll('#pricing details').forEach(function (other) {
          if (other !== el) other.removeAttribute('open');
        });
      }
    });
  });

  // ===== Product Tour: Web View / Mobile View slider (Swiper) =====
  (function () {
    const panels = document.querySelectorAll('.tour-panel');
    const tabBtns = document.querySelectorAll('.tour-tab-btn');
    const swiperInstances = {};

    panels.forEach(function (panel) {
      const key = panel.dataset.tourPanel;
      const caption = {
        title: panel.querySelector('.tour-caption-title'),
        desc: panel.querySelector('.tour-caption-desc'),
      };

      function updateCaption(swiper) {
        const slide = swiper.slides[swiper.activeIndex];
        if (!slide) return;
        if (caption.title) caption.title.textContent = slide.dataset.title || '';
        if (caption.desc) caption.desc.textContent = slide.dataset.desc || '';
      }

      const swiper = new Swiper(panel.querySelector('.tour-swiper'), {
        loop: false,
        speed: 450,
        pagination: {
          el: panel.querySelector('.tour-pagination'),
          clickable: false,
          bulletClass: 'swiper-bullet',
          bulletActiveClass: 'active',
          renderBullet: function (index, className) {
            return '<button class="' + className + '" aria-label="Go to slide ' + (index + 1) + '"></button>';
          },
        },
        on: {
          slideChange: updateCaption,
          init: updateCaption,
        },
      });

      // Wire prev/next arrows directly to the Swiper API (more reliable than Swiper's built-in
      // navigation option, which can fail to bind when nextEl/prevEl are passed as live elements).
      const prevBtn = panel.querySelector('.tour-prev');
      const nextBtn = panel.querySelector('.tour-next');
      if (prevBtn) prevBtn.addEventListener('click', function () { swiper.slidePrev(); });
      if (nextBtn) nextBtn.addEventListener('click', function () { swiper.slideNext(); });

      // Wire pagination dots directly too, via event delegation (robust even as Swiper
      // re-renders the bullet elements on every update).
      const paginationEl = panel.querySelector('.tour-pagination');
      if (paginationEl) {
        paginationEl.addEventListener('click', function (e) {
          const bullet = e.target.closest('.swiper-bullet');
          if (!bullet) return;
          const index = Array.from(paginationEl.children).indexOf(bullet);
          if (index === -1) return;
          swiper.slideTo(index);
        });
      }

      swiperInstances[key] = swiper;
    });

    tabBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        const target = btn.dataset.tourTab;
        tabBtns.forEach(function (b) { b.classList.toggle('active', b === btn); });
        panels.forEach(function (panel) {
          const isTarget = panel.dataset.tourPanel === target;
          panel.classList.toggle('hidden', !isTarget);
        });
        // Swiper needs a resize/update after being un-hidden so slide widths are measured correctly
        if (swiperInstances[target]) {
          swiperInstances[target].update();
          swiperInstances[target].slideTo(0, 0);
        }
      });
    });
  })();
</script>
